; VoIP demo: authenticated chan_sip MESSAGE relay to local peers only.
; Required in sip.conf [general]:
;   accept_outofcall_message = yes
;   outofcall_message_context = messages
;   auth_message_requests = yes
; Include this file from extensions.conf; do not overwrite an existing [messages].
; No body logging, no external-domain relay; voice contexts remain unchanged.
[messages]
exten => 1001,1,MessageSend(sip:1001,${MESSAGE(from)})
 same => n,NoOp(VoIP demo MESSAGE target=1001 status=${MESSAGE_SEND_STATUS})
 same => n,Hangup()
exten => 1002,1,MessageSend(sip:1002,${MESSAGE(from)})
 same => n,NoOp(VoIP demo MESSAGE target=1002 status=${MESSAGE_SEND_STATUS})
 same => n,Hangup()
